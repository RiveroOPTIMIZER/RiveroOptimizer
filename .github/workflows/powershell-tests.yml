name: Rivero PowerShell checks

on:
  push:
    branches:
      - main
      - rivero/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force

      - name: Parse PowerShell source
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -Filter *.ps1
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
            }
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          Invoke-Pester -Path ./tests -CI
